<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1120" height="780" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <text x="40" y="45" font-size="24" font-weight="bold" fill="#111827">Termostato PID - Esquema de conexiones</text>
  <text x="40" y="68" font-size="13" fill="#4b5563">Todos los módulos comparten 5 V y GND con el Arduino (omitidos por claridad). En rojo, la parte de red de 230 V.</text>

  <!-- ARDUINO -->
  <rect x="420" y="110" width="200" height="410" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2.5"/>
  <text x="520" y="135" font-size="16" font-weight="bold" fill="#004d40" text-anchor="middle">Arduino Leonardo</text>
  <text x="520" y="153" font-size="12" fill="#004d40" text-anchor="middle">ATmega32U4</text>

  <g font-size="13" fill="#004d40">
    <text x="430" y="179">D8</text><text x="430" y="214">D9</text>
    <text x="430" y="249">D4</text><text x="430" y="284">D5</text>
    <text x="430" y="319">D6</text><text x="430" y="354">D7</text>
    <text x="610" y="169" text-anchor="end">D2 (INT1)</text>
    <text x="610" y="289" text-anchor="end">D3</text>
    <text x="450" y="508" text-anchor="middle">A0</text>
    <text x="520" y="508" text-anchor="middle">A4</text>
    <text x="590" y="508" text-anchor="middle">A2</text>
  </g>

  <!-- LCD -->
  <rect x="60" y="150" width="200" height="230" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="160" y="175" font-size="16" font-weight="bold" fill="#0d47a1" text-anchor="middle">LCD 20x4</text>
  <text x="160" y="192" font-size="12" fill="#0d47a1" text-anchor="middle">HD44780U, modo 4 bits</text>
  <g font-size="13" fill="#0d47a1" text-anchor="end">
    <text x="250" y="179">RS</text><text x="250" y="214">E</text>
    <text x="250" y="249">DB4</text><text x="250" y="284">DB5</text>
    <text x="250" y="319">DB6</text><text x="250" y="354">DB7</text>
  </g>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <line x1="260" y1="175" x2="420" y2="175"/>
    <line x1="260" y1="210" x2="420" y2="210"/>
    <line x1="260" y1="245" x2="420" y2="245"/>
    <line x1="260" y1="280" x2="420" y2="280"/>
    <line x1="260" y1="315" x2="420" y2="315"/>
    <line x1="260" y1="350" x2="420" y2="350"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="60" y="405">R/W - GND (solo escritura)</text>
    <text x="60" y="423">V0 - potenciómetro externo (contraste)</text>
    <text x="60" y="441">VDD, LED+ - 5 V</text>
    <text x="60" y="459">VSS, LED- - GND</text>
  </g>

  <!-- ZCD -->
  <rect x="780" y="125" width="160" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="860" y="153" font-size="15" font-weight="bold" fill="#7a5200" text-anchor="middle">Módulo ZCD</text>
  <text x="860" y="173" font-size="12" fill="#7a5200" text-anchor="middle">Detector paso por cero</text>
  <line x1="780" y1="165" x2="620" y2="165" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="157" font-size="12" fill="#374151" text-anchor="middle">pulso cruce por 0</text>

  <!-- TRIAC -->
  <rect x="780" y="245" width="160" height="80" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="860" y="276" font-size="15" font-weight="bold" fill="#7a5200" text-anchor="middle">Módulo TRIAC</text>
  <text x="860" y="296" font-size="12" fill="#7a5200" text-anchor="middle">Optotriac + TRIAC</text>
  <line x1="620" y1="285" x2="780" y2="285" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="277" font-size="12" fill="#374151" text-anchor="middle">CTL (activo en bajo)</text>

  <!-- MAINS -->
  <g stroke="#c62828" stroke-width="2.5" fill="none">
    <!-- buses -->
    <line x1="1000" y1="175" x2="1000" y2="520"/>
    <line x1="1050" y1="145" x2="1050" y2="520"/>
    <!-- ZCD -->
    <line x1="940" y1="145" x2="1050" y2="145"/>
    <line x1="940" y1="175" x2="1000" y2="175"/>
    <!-- TRIAC in -->
    <line x1="940" y1="265" x2="1000" y2="265"/>
    <!-- TRIAC out -> lamp -> N -->
    <polyline points="940,305 960,305 960,404"/>
    <path d="M960 456 V480 H992 a8 8 0 0 1 16 0 H1050"/>
  </g>
  <g fill="#c62828">
    <circle cx="1000" cy="175" r="4"/><circle cx="1050" cy="145" r="4"/>
    <circle cx="1000" cy="265" r="4"/><circle cx="1050" cy="480" r="4"/>
  </g>
  <g font-size="11" fill="#c62828">
    <text x="946" y="141">N</text><text x="946" y="171">L</text>
    <text x="946" y="261">L in</text><text x="968" y="330">a la carga</text>
  </g>
  <!-- lamp -->
  <circle cx="960" cy="430" r="26" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
  <path d="M948 442 L954 420 L960 436 L966 420 L972 442" fill="none" stroke="#e65100" stroke-width="2"/>
  <text x="920" y="435" font-size="13" fill="#e65100" text-anchor="end">Bombilla</text>
  <text x="1000" y="550" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">L</text>
  <text x="1050" y="550" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">N</text>
  <text x="1025" y="570" font-size="12" fill="#c62828" text-anchor="middle">Red 230 V AC</text>

  <!-- BOTTOM INPUTS -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <polyline points="450,520 450,565 250,565 250,610"/>
    <line x1="520" y1="520" x2="520" y2="610"/>
    <polyline points="590,520 590,565 790,565 790,610"/>
  </g>

  <rect x="150" y="610" width="200" height="85" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="250" y="640" font-size="15" font-weight="bold" fill="#4a148c" text-anchor="middle">Keypad analógico</text>
  <text x="250" y="660" font-size="12" fill="#4a148c" text-anchor="middle">5 teclas, una sola salida</text>
  <text x="250" y="678" font-size="12" fill="#4a148c" text-anchor="middle">OUT - A0</text>

  <rect x="420" y="610" width="200" height="85" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="520" y="640" font-size="15" font-weight="bold" fill="#4a148c" text-anchor="middle">Sensor de temperatura</text>
  <text x="520" y="660" font-size="12" fill="#4a148c" text-anchor="middle">LM35D (en pruebas: LDR)</text>
  <text x="520" y="678" font-size="12" fill="#4a148c" text-anchor="middle">señal - A4</text>

  <rect x="690" y="610" width="200" height="85" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="790" y="640" font-size="15" font-weight="bold" fill="#4a148c" text-anchor="middle">Potenciómetro</text>
  <text x="790" y="660" font-size="12" fill="#4a148c" text-anchor="middle">modo potenciómetro</text>
  <text x="790" y="678" font-size="12" fill="#4a148c" text-anchor="middle">cursor - A2</text>

  <text x="40" y="745" font-size="12" fill="#6b7280">Esquema de bloques con los pines reales del firmware. Las etiquetas de los terminales de los módulos de potencia pueden variar según el fabricante.</text>
</svg>
